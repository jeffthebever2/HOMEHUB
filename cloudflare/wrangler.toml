# ============================================================
# wrangler.toml — HomeHub Cloudflare Worker
#
# Deploy:  npx wrangler deploy
# Dev:     npx wrangler dev
# Secret:  npx wrangler secret put UPLOAD_TOKEN
# ============================================================

name               = "homehub-media"
main               = "src/index.js"
compatibility_date = "2024-12-01"

# ── R2 Bucket ────────────────────────────────────────────────
[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "homehub-media"   # Change to your R2 bucket name

# ── Environment Variables ────────────────────────────────────
[vars]
ENVIRONMENT    = "production"
ALLOWED_ORIGIN = "https://homehub.jeffthebever2.com"  # Your Vercel domain
MAX_UPLOAD_MB  = "25"

# ── Dev overrides ─────────────────────────────────────────────
[env.dev]
vars = { ENVIRONMENT = "dev", ALLOWED_ORIGIN = "*" }
