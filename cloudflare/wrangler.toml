# ============================================================
# wrangler.toml — HomeHub Cloudflare Worker
#
# Account: jeffthebever200 (a0c01e7692d33cb4602f72fd4f974c5a)
# Worker:  homehub-media
# URL:     https://homehub-media.jeffthebever200.workers.dev
# Bucket:  homehub (binding: MEDIA)
#
# Deploy:  npx wrangler deploy
# Dev:     npx wrangler dev
# Secret:  npx wrangler secret put UPLOAD_TOKEN
# ============================================================

name               = "homehub-media"
main               = "src/index.js"
compatibility_date = "2024-12-01"

# ── R2 Bucket ────────────────────────────────────────────────
[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "homehub"

# ── Environment Variables ────────────────────────────────────
# ALLOWED_ORIGIN: NO trailing slash — browsers send Origin: https://foo.com
# (no slash), so "https://foo.com/" fails the CORS string match.
[vars]
ENVIRONMENT    = "production"
ALLOWED_ORIGIN = "https://homehub-mu.vercel.app"
MAX_UPLOAD_MB  = "25"

# ── Dev overrides ─────────────────────────────────────────────
[env.dev]
vars = { ENVIRONMENT = "dev", ALLOWED_ORIGIN = "*" }
